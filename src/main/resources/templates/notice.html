<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${heading}">Thông báo từ itjobs</title>
</head>
<!-- One layout for every account / application / payment notice: heading, text, optional details, note, job cards and button. -->
<body style="margin:0;padding:0;background:#FFF7EF;font-family:Arial,Helvetica,sans-serif;color:#1F1A16;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF7EF;padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #EDE1D5;border-radius:12px;">
                <tr th:replace="~{fragments :: logo}"></tr>
                <tr><td style="padding:8px 32px 0;font-size:18px;font-weight:700;" th:text="${heading}">Tiêu đề</td></tr>
                <tr>
                    <td style="padding:12px 32px 0;font-size:14px;line-height:1.6;color:#3E3630;">
                        Xin chào <strong th:text="${name}">bạn</strong>,<br>
                        <span th:text="${intro}" style="white-space:pre-line;">Nội dung</span>
                    </td>
                </tr>
                <tr th:if="${details != null and !details.isEmpty()}">
                    <td style="padding:16px 32px 0;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #EDE1D5;border-radius:10px;">
                            <tr th:each="row, it : ${details}">
                                <td th:text="${row.key}" th:style="${it.last} ? 'padding:9px 14px;font-size:13px;color:#6B635C;' : 'padding:9px 14px;font-size:13px;color:#6B635C;border-bottom:1px solid #F3EAE1;'"
                                    style="padding:9px 14px;font-size:13px;color:#6B635C;">Nhãn</td>
                                <td th:text="${row.value}" align="right" th:style="${it.last} ? 'padding:9px 14px;font-size:13px;font-weight:700;' : 'padding:9px 14px;font-size:13px;font-weight:700;border-bottom:1px solid #F3EAE1;'"
                                    style="padding:9px 14px;font-size:13px;font-weight:700;">Giá trị</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr th:if="${note != null}">
                    <td style="padding:16px 32px 0;">
                        <div style="padding:12px 16px;background:#FFF7EF;border-left:3px solid #E3763C;border-radius:6px;font-size:13.5px;line-height:1.6;color:#3E3630;">
                            <strong th:text="${noteTitle}">Ghi chú</strong><br>
                            <span th:text="${note}" style="white-space:pre-line;">…</span>
                        </div>
                    </td>
                </tr>
                <tr th:if="${jobs != null and !jobs.isEmpty()}">
                    <td style="padding:22px 32px 0;">
                        <div style="padding-top:18px;border-top:1px solid #EDE1D5;font-size:15px;font-weight:700;" th:text="${jobsTitle}">Việc làm</div>
                    </td>
                </tr>
                <tr th:replace="~{fragments :: jobs(${jobs})}"></tr>
                <tr th:if="${ctaUrl != null}">
                    <td align="center" style="padding:22px 32px 4px;">
                        <a th:href="${ctaUrl}" href="#" th:text="${ctaLabel}" style="display:inline-block;padding:11px 24px;background:#E3763C;color:#1F1409;font-weight:700;font-size:14px;text-decoration:none;border-radius:8px;">Mở itjobs</a>
                    </td>
                </tr>
                <tr>
                    <td th:text="${reason}" style="padding:20px 32px 24px;font-size:12px;line-height:1.6;color:#6B635C;">Lý do bạn nhận được email này.</td>
                </tr>
            </table>
            <table th:replace="~{fragments :: footer}"></table>
        </td>
    </tr>
</table>
</body>
</html>
