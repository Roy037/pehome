spring.application.name=jobhunter

# Secrets never live in this file. Put DB_PASSWORD, JWT_SECRET (base64, >= 64 bytes for HS512) and MAIL_PASSWORD
# in an untracked .env next to build.gradle.kts (see .env.example) or in the run configuration's environment.
spring.config.import=optional:file:./.env[.properties]

#config database
###
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that entities and tables agree.
# An existing database is adopted as version 1 on first start. If it is older than the baseline, run once with
# DDL_AUTO=update to catch it up (see README).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.datasource.url=jdbc:mysql://localhost:3306/pehome
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Set SHOW_SQL=true to log every SQL statement while debugging
spring.jpa.show-sql=${SHOW_SQL:false}



###
###
#config jwt
hoidanit.jwt.base64-secret=${JWT_SECRET:}
#access token: 30 minutes (the browser renews it with the refresh cookie); refresh token: 100 days
hoidanit.jwt.access-token-validity-in-seconds=1800
hoidanit.jwt.refresh-token-validity-in-seconds=8640000

###
#config upload file
###
#CVs are capped at 5MB (the UI checks too); anything bigger is rejected with 413
spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=5MB
###
# Override per machine with the UPLOAD_BASE_URI env var (e.g. file:///Users/<you>/jobhunter-upload/ on macOS).
hoidanit.upload-file.base-uri=${UPLOAD_BASE_URI:file:///D:/Backend%20Java%20spring/upload/}

###config pagination
spring.data.web.pageable.one-indexed-parameters=true
###config email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

###app
# Where the reset-password link in e-mails points, and who the e-mail claims to be from (blank = the SMTP account)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Public address of this API: the one-click "unsubscribe" header in the weekly digest points here.
app.backend-url=${BACKEND_URL:http://localhost:8080}
# Who is e-mailed when something needs an admin (new company to approve, job post reported). Comma separated; blank = nobody.
app.admin-alert.to=${ADMIN_ALERT_EMAIL:}

# Scheduled e-mails ("-" switches one off): weekly job-alert digest, daily Premium renewal reminder.
app.job-alert.cron=${JOB_ALERT_CRON:0 0 8 * * MON}
app.plan-reminder.cron=${PLAN_REMINDER_CRON:0 0 9 * * *}
# More scheduled e-mails ("-" switches each off): employers' morning digest of new applications, saved jobs closing soon
# (candidates), posts closing soon (employers), the day-before interview reminder (hourly).
app.hr-digest.cron=${HR_DIGEST_CRON:0 30 8 * * *}
app.saved-job-reminder.cron=${SAVED_JOB_REMINDER_CRON:0 30 9 * * *}
app.job-expiry-reminder.cron=${JOB_EXPIRY_REMINDER_CRON:0 0 10 * * *}
app.interview-reminder.cron=${INTERVIEW_REMINDER_CRON:0 0 * * * *}
app.mail.from=${MAIL_FROM:}

###social sign-in (Google / Facebook / LinkedIn): a button turns on once its client id and secret are set.
# Register this redirect URI in each console:  <BACKEND_URL>/api/v1/auth/oauth/<google|facebook|linkedin>/callback
# The *_URL values are the real endpoints; they only change to point tests at a fake provider.
app.oauth.providers.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.providers.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.providers.google.authorize-url=${OAUTH_GOOGLE_AUTHORIZE_URL:https://accounts.google.com/o/oauth2/v2/auth}
app.oauth.providers.google.token-url=${OAUTH_GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
app.oauth.providers.google.userinfo-url=${OAUTH_GOOGLE_USERINFO_URL:https://openidconnect.googleapis.com/v1/userinfo}
app.oauth.providers.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth.providers.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth.providers.facebook.authorize-url=${OAUTH_FACEBOOK_AUTHORIZE_URL:https://www.facebook.com/v19.0/dialog/oauth}
app.oauth.providers.facebook.token-url=${OAUTH_FACEBOOK_TOKEN_URL:https://graph.facebook.com/v19.0/oauth/access_token}
app.oauth.providers.facebook.userinfo-url=${OAUTH_FACEBOOK_USERINFO_URL:https://graph.facebook.com/v19.0/me}
app.oauth.providers.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
app.oauth.providers.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
app.oauth.providers.linkedin.authorize-url=${OAUTH_LINKEDIN_AUTHORIZE_URL:https://www.linkedin.com/oauth/v2/authorization}
app.oauth.providers.linkedin.token-url=${OAUTH_LINKEDIN_TOKEN_URL:https://www.linkedin.com/oauth/v2/accessToken}
app.oauth.providers.linkedin.userinfo-url=${OAUTH_LINKEDIN_USERINFO_URL:https://api.linkedin.com/v2/userinfo}

###payment (VNPay, ZaloPay and MoMo sandbox)
# Credentials come from the VNPay sandbox merchant portal; leave empty and payments answer 503.
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# DEV ONLY: true swaps all payment gateways for the built-in fake gateway.
app.payment.mock=${PAYMENT_MOCK:false}
app.payment.zalopay.app-id=${ZALOPAY_APP_ID:0}
app.payment.zalopay.key1=${ZALOPAY_KEY1:}
app.payment.zalopay.key2=${ZALOPAY_KEY2:}
app.payment.zalopay.base-url=${ZALOPAY_BASE_URL:https://sb-openapi.zalopay.vn/v2}
# Optional public HTTPS endpoint; leave blank to use the callback registered with the merchant.
app.payment.zalopay.callback-url=${ZALOPAY_CALLBACK_URL:}
app.payment.zalopay.reconcile-cron=${ZALOPAY_RECONCILE_CRON:0 * * * * *}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:}
app.payment.momo.base-url=${MOMO_BASE_URL:https://test-payment.momo.vn/v2/gateway/api}
app.payment.momo.ipn-url=${MOMO_IPN_URL:${app.backend-url}/api/v1/payments/momo-ipn}
app.payment.momo.reconcile-cron=${MOMO_RECONCILE_CRON:15 * * * * *}
